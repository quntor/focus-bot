name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Тесты инвариантов (IDOR, гонка /focus, повтор update_id, outbox) без
    # настоящей базы ничего не доказывают: мок не знает про уникальные индексы.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: focus
          POSTGRES_PASSWORD: focus
          POSTGRES_DB: focus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://focus:focus@localhost:5432/focus_test
      # Без базы тесты с базой пропускаются — здесь это ошибка, а не пропуск.
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Клиент Prisma генерируется из схемы и в репозиторий не коммитится,
      # без этого шага не проходит проверка типов.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
