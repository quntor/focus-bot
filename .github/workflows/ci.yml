name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Клиент Prisma генерируется из схемы и в репозиторий не коммитится,
      # без этого шага не проходит проверка типов.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
